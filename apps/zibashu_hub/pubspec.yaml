name: zibashu_hub
description: ziBashu Hub - family catalog of ziBashu Android apps.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.1
  zibashu_core:
